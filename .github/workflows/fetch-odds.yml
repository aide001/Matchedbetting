name: Fetch odds

on:
  schedule:
    # Every 6 hours. With 3 sports at 2 requests each this uses about 370 of the
    # free plan's 500 monthly requests. Change ODDS_SPORTS or the schedule to suit your plan.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SPORTS: soccer_epl,soccer_efl_champ,soccer_uefa_champs_league
        run: node scripts/fetch-odds.mjs
      - name: Commit updated odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update odds"
            git push
          fi
